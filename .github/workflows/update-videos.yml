name: Update Videos

on:
  workflow_dispatch:
    inputs:
      extra_videos:
        description: '未掲載の作品を追加で取り込む本数（人気順 101 位以降から。0 なら通常の更新のみ）'
        required: false
        default: '0'
  schedule:
    - cron: '0 21 * * *' # 毎日 06:00 JST

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch metadata from FANZA API
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          EXTRA_VIDEOS: ${{ github.event.inputs.extra_videos || '0' }}
        run: node scripts/fetch-metadata.js

      - name: Build search.html and SEO pages
        run: |
          node scripts/build-search.js
          node scripts/build-pages.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/videos.json index.html search.html sitemap.xml feed.xml video actress genre ranking new
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "chore: update metadata $(date +'%Y-%m-%d')" &&
            git push &&
            node scripts/indexnow.js HEAD~1
          )
